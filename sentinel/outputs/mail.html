<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel silent mode</title>
<style>
:root{--bg:#f6f6f4;--panel:#ffffff;--soft:#f1f0ed;--line:#e1dfda;--ink:#141413;--ink2:#55534e;--muted:#8a8984;
 --accent:#2a78d6;--accent-soft:#e7f0fb;--good:#0ca30c;--good-soft:#e5f6e5;--warn:#c98a00;--warn-soft:#fff3d6;
 --crit:#d03b3b;--crit-soft:#fde8e8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--soft:#292927;--line:#3a3a37;--ink:#f0efec;
 --ink2:#c3c2b7;--muted:#8f8e88;--accent:#4a95ea;--accent-soft:#1d2d40;--good:#3fc23f;--good-soft:#1c2e1c;
 --warn:#e2a92a;--warn-soft:#352b14;--crit:#ef6565;--crit-soft:#3a1d1d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:14px 18px 24px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:18px;margin:0}header .sub{color:var(--muted)}.spacer{flex:1}
a.btn{font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 12px;text-decoration:none}
.banner{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel);
 border-radius:12px;padding:10px 14px;margin-bottom:12px}
.banner b{color:var(--c)}
.mailbox{display:grid;grid-template-columns:360px minmax(0,1fr);gap:10px;min-height:640px}
@media (max-width:900px){.mailbox{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card h2{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin:0;padding:10px 14px;
 border-bottom:1px solid var(--line);display:flex}
.card h2 span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.list{overflow:auto}
.m{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.m:hover{background:var(--soft)}.m.sel{background:var(--soft);border-left-color:var(--accent)}
.m .from{display:flex;gap:6px;align-items:center;font-weight:600}
.m .when{margin-left:auto;font:12px Consolas,monospace;color:var(--muted);font-weight:400}
.m .subj{margin-top:2px}.m .prev{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:650;border-radius:6px;padding:1px 7px}
.t-digest{background:var(--accent-soft);color:var(--accent)}.t-alert{background:var(--crit);color:#fff}
.msg{padding:18px 24px;overflow:auto}
.hdr{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.hdr .s{font-size:19px;font-weight:650;margin-bottom:8px}
.hdr .row{display:grid;grid-template-columns:70px 1fr;color:var(--ink2);font-size:12.5px}
.hdr .row b{color:var(--ink);font-weight:500}
.body h1{font-size:17px;margin:4px 0 8px}.body h2{font-size:15px;margin:14px 0 6px}
.body h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin:16px 0 4px}
.body ul{margin:0;padding-left:20px}.body li{margin:3px 0}.body p{margin:6px 0}
.body code{font:12px Consolas,monospace;background:var(--soft);padding:0 4px;border-radius:4px}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.att{border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:12.5px;background:var(--soft)}
.att:hover{border-color:var(--accent)}
.empty{color:var(--muted);padding:18px}
</style></head>
<body><div class="wrap">
<header><h1>Sentinel</h1><span class="sub">5a · silent mode · the reports it sends</span><span class="spacer"></span>
 <a class="btn" href="/">Architecture view</a><a class="btn" href="/workflow">Workflow view</a></header>
<div class="banner" id="banner" style="--c:var(--muted)">loading…</div>
<div class="mailbox">
 <div class="card"><h2>Inbox <span id="count"></span></h2><div class="list" id="list"></div></div>
 <div class="card"><div class="msg" id="msg"><div class="empty">Select a message.</div></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let M=[],sel=null,state={};
function md(s){return s.split("\n").map(l=>{let h=esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/^_(.*)_$/,"<i>$1</i>");
 if(l.startsWith("# "))return`<h1>${h.slice(2)}</h1>`;if(l.startsWith("## "))return`<h2>${h.slice(3)}</h2>`;if(l.startsWith("### "))return`<h3>${h.slice(4)}</h3>`;
 if(/^\s+- /.test(l))return`<ul style="margin-left:16px"><li>${h.replace(/^\s+- /,"")}</li></ul>`;if(l.startsWith("- "))return`<ul><li>${h.slice(2)}</li></ul>`;
 return l.trim()?`<p>${h}</p>`:"";}).join("").replace(/<\/ul><ul>/g,"");}
const TICK=String.fromCharCode(96);
function preview(m){const l=m.body.split("\n").filter(x=>x.trim()&&!x.startsWith("#")&&!x.startsWith("_"))[0]||"";
 return l.split("**").join("").split(TICK).join("").replace(/^- /,"");}
function to(){return state.email?.configured?state.email.to:"ops-oncall@marketplace.example (preview)";}
function render(){
 $("#count").textContent=`${M.length} message${M.length===1?"":"s"}`;
 const b=$("#banner");
 if(state.email?.configured){b.style.setProperty("--c","var(--good)");b.innerHTML=`<b>E-mail on</b> · reports are delivered to ${esc(state.email.to)}${state.finished?"; the run digest has been sent.":"; the digest follows when the run ends."}`;}
 else{b.style.setProperty("--c","var(--warn)");b.innerHTML=`<b>Preview</b> · no mail server configured, so nothing leaves this machine: these are exactly the messages silent mode sends (set SMTP_HOST and ALERT_EMAIL_TO, or pass --email-to, to deliver them).`;}
 $("#list").innerHTML=M.length?M.map((m,i)=>`<div class="m ${i===sel?"sel":""}" data-i="${i}"><div class="from">Sentinel
  <span class="tag t-${m.kind}">${m.kind==="digest"?"run digest":"P1 alert"}</span><span class="when">${esc((m.sim_ts||"").slice(5,16))}</span></div>
  <div class="subj">${esc(m.subject)}</div><div class="prev">${esc(preview(m))}</div></div>`).join("")
  :`<div class="empty">No report sent yet: silent mode only mails FINAL_REPORT alerts, and the digest when the run ends.</div>`;
 document.querySelectorAll(".m").forEach(el=>el.onclick=()=>{sel=+el.dataset.i;render();});
 const m=M[sel];if(!m){$("#msg").innerHTML=`<div class="empty">Select a message.</div>`;return;}
 const atts=m.kind==="digest"?M.filter(x=>x.kind==="alert"):[];
 $("#msg").innerHTML=`<div class="hdr"><div class="s">${esc(m.subject)}</div>
  <div class="row"><span>From</span><b>Sentinel &lt;sentinel@marketplace.example&gt;</b></div>
  <div class="row"><span>To</span><b>${esc(to())}</b></div>
  <div class="row"><span>When</span><b>${esc(m.sim_ts||"end of run")} (simulated)</b></div></div>
  <div class="body">${md(m.body.replace(/^# .*\n/,""))}</div>
  ${atts.length?`<div class="atts">${atts.map(a=>`<span class="att" data-n="${esc(a.name)}">📎 ${esc(a.name)}</span>`).join("")}</div>`:""}`;
 document.querySelectorAll(".att").forEach(el=>el.onclick=()=>{sel=M.findIndex(x=>x.name===el.dataset.n);render();});}
async function load(){try{const r=await (await fetch("/api/outbox")).json();state=r;const prev=M.length;M=r.mails;
  if(sel===null||sel>=M.length||M.length!==prev)sel=M.length?0:null;render();
  if(!r.finished)setTimeout(load,2000);}catch(_){setTimeout(load,3000);}}
load();
</script></body></html>
