# Planned calendar of the simulated year (2025-10-27 .. 2026-10-25) and its past incidents.
#
# Dates and times are Europe/Berlin local time (the local time of every country), so a
# day runs from local midnight to local midnight across the DST changes of 2026-03-29
# and 2026-10-25. A timestamp ending in Z is UTC. `day` is one local day, `from`/`to`
# are inclusive local days, `start`/`end` are timestamps (end exclusive, open if absent).
# Effects use the scenario effect names (params.MULTIPLICATIVE_EFFECTS multiply the
# simulator parameter inside `scope`; oos_exposure_share and delivery_lag_days replace it).
# Calendar entries are planned and log one event at their start; incidents are unplanned
# and log a release event at the start and a resolution event at the end.

growth: {per_year: 0.15, anchor: 2026-08-31}   # sessions x 1.15 ** (days since anchor / 365)

retail:
  - {id: black_friday_2025, day: 2025-11-28, effects: {sessions: 2.5, discount_rate: 3.0},
     description: Black Friday}
  - {id: cyber_monday_2025, day: 2025-12-01, effects: {sessions: 1.8}, description: Cyber Monday}
  - {id: christmas_ramp_2025, from: 2025-12-01, to: 2025-12-22, effects: {sessions: 1.3},
     description: Christmas shopping ramp}
  - {id: christmas_peak_2025, from: 2025-12-15, to: 2025-12-20, effects: {sessions: 1.15},
     description: "Christmas peak, on top of the ramp (x1.5 in total)"}
  - {id: christmas_low_2025, from: 2025-12-24, to: 2025-12-26, effects: {sessions: 0.6},
     description: Christmas holidays}
  - {id: january_sales_2026, from: 2026-01-02, to: 2026-01-15, effects: {sessions: 1.3, discount_rate: 2.0},
     description: January sales}
  - {id: summer_sale_2026, from: 2026-07-06, to: 2026-07-12, effects: {sessions: 1.4},
     description: Summer sale}

seasonality:                     # monthly factors, applied to every month of that number in the year
  - {id: season_nov, month: 11, effects: {sessions: 1.2}, description: November peak season}
  - {id: season_dec, month: 12, effects: {sessions: 1.2}, description: December peak season}
  - {id: season_aug_de, month: 8, scope: {country: de}, effects: {sessions: 0.85}, description: Summer holidays}
  - {id: season_aug_nl, month: 8, scope: {country: nl}, effects: {sessions: 0.85}, description: Summer holidays}
  - {id: season_aug_pl, month: 8, scope: {country: pl}, effects: {sessions: 0.85}, description: Summer holidays}
  - {id: season_aug_fr, month: 8, scope: {country: fr}, effects: {sessions: 0.75}, description: Summer holidays}
  - {id: season_aug_es, month: 8, scope: {country: es}, effects: {sessions: 0.75}, description: Summer holidays}
  - {id: season_sep_toys, month: 9, scope: {category: toys}, effects: {add_to_cart_rate: 1.1},
     description: Back to school}
  - {id: season_sep_fashion, month: 9, scope: {category: fashion}, effects: {add_to_cart_rate: 1.1},
     description: Back to school}

holidays:                        # sessions x0.8 for the local day in that country
  - {country: de, day: 2026-10-03, description: Tag der Deutschen Einheit}
  - {country: de, day: 2026-04-06, description: Ostermontag}
  - {country: de, day: 2026-05-01, description: Tag der Arbeit}
  - {country: fr, day: 2026-07-14, description: Fete nationale}
  - {country: fr, day: 2026-08-15, description: Assomption}
  - {country: fr, day: 2026-05-01, description: Fete du Travail}
  - {country: es, day: 2026-10-12, description: Fiesta Nacional}
  - {country: es, day: 2026-08-15, description: Asuncion}
  - {country: nl, day: 2026-04-27, description: Koningsdag}
  - {country: pl, day: 2026-05-03, description: Swieto Konstytucji 3 Maja}
  - {country: pl, day: 2025-11-01, description: Wszystkich Swietych}
holiday_effects: {sessions: 0.8}

payday: {last_days: 2, first_days: 2, effects: {sessions: 1.05}}   # one 4-day window per month boundary

structural:                      # innocent planned changes, open-ended. params.py holds the current values,
                                 # so `before` scales the parameter back for the history before the change
  - {id: fashion_take_rate_2026_05, start: 2026-05-01, scope: {category: fashion},
     before: {take_rate: 0.9375}, type: config, service: pricing,
     description: "Fashion take rate +1pt (15% -> 16%)"}
  - {id: paid_budget_2026_02, start: 2026-02-01, scope: {channel: paid}, before: {sessions: 0.833333},
     type: config, service: marketing, description: Paid acquisition budget x1.2}

incidents:                       # past faults, unplanned
  - {id: checkout_bug_web_fr, start: 2026-03-10T14:00, end: 2026-03-10T20:00,
     scope: {country: fr, platform: web}, effects: {checkout_rate: 0.7}, service: checkout,
     release: "checkout 3.8 rollout", resolution: "rollback to checkout 3.7"}
  - {id: search_relevance_es, start: 2026-04-15T10:00, end: 2026-04-15T18:00,
     scope: {country: es}, effects: {search_relevance: 0.7}, service: search,
     release: "ranker v19 rollout", resolution: "rollback to ranker v18"}
  - {id: supplier_delay_electronics, start: 2026-06-01T08:00, end: 2026-06-20T08:00,
     scope: {category: electronics}, effects: {delivery_lag_days: 10}, service: supply-chain,
     release: "new electronics supplier contract (10-day lead time)", resolution: "supplier lead time back to 3 days"}
  - {id: recs_model_shift_for_you, start: 2026-07-20T00:00, end: 2026-07-22T00:00,
     scope: {channel: for_you}, effects: {oos_exposure_share: 0.25}, service: recs-model,
     release: "model v31", resolution: "rollback to model v30"}
  - {id: ads_pacing_bug_adv_005, start: 2026-09-08T00:00, end: 2026-09-09T00:00,
     scope: {advertiser: adv_005}, effects: {ad_spend: 4}, service: ads-pacing,
     release: "pacing 2.4 rollout", resolution: "pacing 2.4.1 hotfix"}
