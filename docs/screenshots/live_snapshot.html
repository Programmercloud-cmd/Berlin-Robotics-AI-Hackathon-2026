.ev{padding:6px 12px;border-bottom:1px solid var(--line)}
.ev .t{font:11px Consolas,monospace;color:var(--muted);margin-right:6px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:9px;margin-right:6px;
 background:var(--soft);color:var(--ink2)}
.THOUGHT .tag{background:#e8e4ff;color:#4a3aa7}.ACTION .tag{background:#dbeafe;color:#1c5cab}
.OBSERVATION .tag{background:#dcfce7;color:#006300}.HYPOTHESIS .tag{background:#fef3c7;color:#8a5a00}
.ANOMALY_DETECTED .tag{background:#fde2e2;color:#a12626}.FINAL_REPORT .tag{background:#d03b3b;color:#fff}
.GRAPH_MUTATION .tag,.META_PROPOSAL .tag,.META_RESULT .tag,.DEAD_END .tag{background:#f3e8ff;color:#6b21a8}
.INNOCENT_CHANGE .tag{background:#e0f2fe;color:#075985}.DATA_ISSUE .tag{background:#fff1d6;color:#8a5a00}
@media (prefers-color-scheme:dark){.tag{filter:brightness(.92)}}
.ev .inc{font-size:10.5px;color:var(--accent);margin-right:6px}
.filters{display:flex;gap:6px}.filters button{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--soft);
 color:var(--ink2);border-radius:12px;padding:1px 9px;cursor:pointer}.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.inc-card{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}.inc-card:hover{background:var(--soft)}
.inc-card.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-right:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#report{padding:10px 14px;font-size:12.5px}#report h2{all:unset;display:block;font-size:15px;font-weight:700;margin:4px 0 8px}

@keyframes pulse{0%{stroke-opacity:1;stroke-width:3}100%{stroke-opacity:.15;stroke-width:9}}

f the change with 35% of volume (z=-2.5); web -7.1% carries 13% of the change with 20% of volume (z=-1.5)\n- **E48** [localise] by category: home -11.8% carries 21% of the change with 20% of volume (z=-2.6); toys -14.4% carries 21% of the change with 16% of volume (z=-2.9); fashion -8.8% carries 20% of the change with 26% of volume (z=-2.0); electronics -10.0% carries 20% of the change with 22% of volume (z=-2.2)\n- **E49** [localise] channel=paid: -10.8% (z=-4.5) vs other channel values +3.8% -> specific to this segment\n- **E50** [events] 3 events: 08:00 campaign  'autumn_campaign' scope=channel=paid; 15:00 release payments-android '5.12 rollout' scope=platform=android; 15:00 release app-ios '7.3 rollout' scope=platform=ios\n- **E51** [predict] in_stock_rate [total] +2.7% (z=+1.2); does not explain the change; Granger p=0.13\n\n### Hypotheses tested\n- **H1** (event, prior 0.35 \u2192 0.83, supported): campaign 'autumn_campaign' (no service) at 08:00 caused the change (planned; expected effect sessions x1.4)\n  - onset falls inside the running campaign window -> confirmed: campaign started 10-26 08:00, onset 10-26 17:00\n  - change concentrated in channel=paid, other channel values normal -> confirmed: -10.8% vs other channel +3.8%\n- **H2** (event, prior 0.12 \u2192 0.01, open): release '5.12 rollout' (payments-android) at 15:00 caused the change\n  - onset coincides with the event (<= 1h) -> refuted: onset 17:00, event 15:00\n  - change concentrated in platform=android (event scope) -> refuted: android carries 57% of the change with 45% of volume\n- **H3** (event, prior 0.35 \u2192 0.13, open): release '7.3 rollout' (app-ios) at 15:00 caused the change\n  - onset coincides with the event (<= 1h) -> refuted: onset 17:00, event 15:00\n  - change concentrated in platform=ios (event scope) -> refuted: ios carries 30% of the change with 35% of volume\n  - mechanism: the released service is linked to the first cause in the graph -> confirmed: app-ios -> add_to_cart_rate via context edges\n- **H4** (causal_edge, prior 0.50 \u2192 0.23, rejected): in_stock_rate moved and drove add_to_cart_rate (+)\n  - in_stock_rate moved in the same segment with the expected sign -> refuted: +2.7%, z=+1.2\n\n### What remains uncertain\n- The change matches a planned event's scope; residual effects inside the scope are listed in the evidence."}}, {"seq": 506, "type": "WATCH", "source": "monitor", "sim_ts": "2026-10-26 20:00:00", "wall_ts": "2026-11-21T22:47:12+00:00", "incident_id": null, "payload": {"metric": "view_rate", "by": ["platform"], "reasons": ["rotation", "recent release: 7.3 rollout"]}}, {"seq": 507, "type": "WATCH", "source": "monitor", "sim_ts": "2026-10-26 20:00:00", "wall_ts": "2026-11-21T22:47:12+00:00", "incident_id": null, "payload": {"metric": "checkout_rate", "by": ["platform"], "reasons": ["rotation", "recent release: 7.3 rollout"]}}, {"seq": 508, "type": "ANOMALY_DETECTED", "source": "monitor", "sim_ts": "2026-10-26 20:00:00", "wall_ts": "2026-11-21T22:47:12+00:00", "incident_id": null, "payload": {"metric": "payment_success_rate", "segment": "channel=for_you", "ts": "2026-10-26 18:00:00", "actual": 0.897674, "expected": 0.94226, "low": 0.897267, "high": 0.987254, "z": -3.963791, "detector": "cusum", "direction": "down", "good_direction": "up", "planned_adjustment": [], "impact_eur_per_h": -96.143585}}, {"seq": 509, "type": "ANOMALY_DETECTED", "source": "monitor", "sim_ts": "2026-10-26 20:00:00", "wall_ts": "2026-11-21T22:47:12+00:00", "incident_id": null, "payload": {"metric": "payment_success_rate", "segment": "channel=paid", "ts": "2026-10-26 16:00:00", "actual": 0.889135, "expected": 0.940566, "low": 0.896032, "high": 0.985099, "z": -4.619502, "detector": "spike", "direction": "down", "good_direction": "up", "planned_adjustment": [], "impact_eur_per_h": -94.472563}}, {"seq": 510, "type": "INNOCENT_CHANGE", "source": "monitor", "sim_ts": "2026-10-26 20:00:00", "wall_ts": "2026-11-21T22:47:12+00:00", "incident_id": null, " <script>
const $=s=>document.querySelector(s);

 "INCIDENT_OPENED","INCIDENT_UPDATED","INCIDENT_RESOLVED","FINAL_REPORT","ANOMALY_DETECTED","INNOCENT_CHANGE","DATA_ISSUE"]);
const MON=new Set(["MONITOR_TICK","WATCH","ANOMALY_DETECTED","INNOCENT_CHANGE","DATA_ISSUE","SERIES_RECOVERED","SYSTEM"]);
let filter="agent", events=[], focus=null, visited=new Set(), graph=null, sel=null, counts={an:0,in:0,al:0,mu:0};
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;

 switch(e.type){
  case "THOUGHT":return p.text;case "ACTION":return `🔧 ${p.tool}`;case "OBSERVATION":return `<b>${p.evidence_id}</b> ${p.text}`;
  case "HYPOTHESIS":return p.prediction?`${p.id}: ${p.prediction} → <b>${p.result}</b> (${p.why}) · posterior ${p.posterior??""}`
                    :`${p.id} ${p.status==="rejected"?"<b>rejected</b>: ":"proposed: "}${p.statement}${p.why?" — "+p.why:""}`;
  case "ANOMALY_DETECTED":return `${p.metric} [${p.segment||"total"}] ${p.detector} z=${(+p.z).toFixed(1)} · actual ${(+p.actual).toPrecision(4)} vs expected ${(+p.expected).toPrecision(4)} · ${(+p.impact_eur_per_h).toFixed(0)} €/h`;
  case "INNOCENT_CHANGE":return `${p.metric} [${p.segment||"total"}] explained by plan: ${(p.explained_by||[]).join(", ")}`;
  case "DATA_ISSUE":return `${p.table} ${p.hour}: completeness ${p.completeness} — ${p.action}`;
  case "INCIDENT_OPENED":return `opened by ${p.trigger.metric} [${p.trigger.segment||"total"}]`;
  case "INCIDENT_UPDATED":return p.merged_into?`merged into ${p.merged_into} (${p.why})`:p.attached?`attached ${p.attached}`:`${p.state||""} ${p.label||""} — ${p.why||""}`;
  case "INCIDENT_RESOLVED":return `resolved (${p.label}) — ${p.why}`;
  case "FINAL_REPORT":return `${p.kind}: ${p.label} · ${p.first_cause} [${p.segment||"total"}]`;
  case "GRAPH_MUTATION":case "META_RESULT":case "META_PROPOSAL":return p.summary||p.text;
  case "DEAD_END":return (p.reasons||[]).join("; ");
  case "MONITOR_TICK":return `watched ${p.watched_series} series · evaluated ${p.hours_evaluated} hours · held ${p.held_incomplete} incomplete · ${p.anomalies} anomalies`;
  case "WATCH":return `watch ${p.metric} by ${p.by.join(",")} — ${p.reasons.join("; ")}`;
  default:return esc(p.message||JSON.stringify(p).slice(0,160));}}
function keep(e){return filter==="all"||(filter==="agent"?AGENT.has(e.type):MON.has(e.type));}
function row(e){return `<div class="ev ${e.type}"><span class="t">${(e.sim_ts||"").slice(5,16)}</span>${e.incident_id?`<span class="inc">${e.incident_id}</span>`:""}<span class="tag">${e.type.replace("_"," ").toLowerCase()}</span>${text(e)}</div>`;}
function renderFeed(){$("#feed").innerHTML=events.filter(keep).slice(-400).reverse().map(row).join("");}
// ---------------- graph
async function loadGraph(){graph=await (await fetch("/api/graph")).json();drawGraph();}
function layout(){const n=graph.nodes,E=graph.edges,depth={};const q=[...graph.roots];q.forEach(r=>depth[r]=0);
 while(q.length){const c=q.shift();E.filter(e=>e.dst===c).forEach(e=>{if(depth[e.src]===undefined){depth[e.src]=depth[c]+1;q.push(e.src);}});}
 const maxd=Math.max(0,...Object.values(depth));n.forEach(x=>{if(depth[x.id]===undefined)depth[x.id]=maxd+1;});
 const layers={};n.forEach(x=>(layers[depth[x.id]]=layers[depth[x.id]]||[]).push(x.id));return {depth,layers};}
function drawGraph(){const svg=$("#graph"),W=svg.clientWidth||560,{layers}=layout(),pos={};
 const L=Object.keys(layers).map(Number).sort((a,b)=>a-b),VG=66;
 L.forEach(d=>{const ids=layers[d];if(d>0)ids.sort((a,b)=>px(a)-px(b));ids.forEach((id,i)=>pos[id]=[W*(i+1)/(ids.length+1),30+d*VG]);});
 function px(id){const xs=graph.edges.filter(e=>e.src===id&&pos[e.dst]).map(e=>pos[e.dst][0]);return xs.length?xs.reduce((a,b)=>a+b)/xs.length:W;}

 const col=e=>e.status==="needs_review"?"var(--serious)":e.status==="proposed"?"var(--violet)":e.status==="validated"?(e.type==="formula"?"var(--good)":"var(--accent)"):"var(--muted)";
 let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
 graph.edges.forEach(e=>{if(!pos[e.src]||!pos[e.dst])return;const [x1,y1]=pos[e.src],[x2,y2]=pos[e.dst],my=(y1+y2)/2;
  const hot=visited.has(e.src)&&visited.has(e.dst);
  s+=`<path d="M${x1},${y1-12} C${x1},${my} ${x2},${my} ${x2},${y2+12}" fill="none" stroke="${hot?"var(--crit)":col(e)}" stroke-width="${hot?3:1.6}" ${e.type==="causal"?'stroke-dasharray="5 4"':""} marker-end="url(#ah)" opacity="${hot?1:.75}"><title>${esc(e.type+": "+e.src+" → "+e.dst+" · "+e.status+" · "+(e.reason||""))}</title></path>`;});
 graph.nodes.forEach(n=>{const [x,y]=pos[n.id],w=Math.max(70,n.id.length*6.4+12),isF=n.id===focus,vis=visited.has(n.id),meta=n.owner==="meta-agent";
  s+=`<g><title>${esc(n.name+" · "+n.kind+" · dims: "+n.dimensions.join(", "))}</title>
  ${isF?`<rect class="focus-ring" x="${x-w/2-4}" y="${y-16}" width="${w+8}" height="32" rx="9" fill="none" stroke="var(--crit)"/>`:""}
  <rect x="${x-w/2}" y="${y-12}" width="${w}" height="24" rx="6" fill="${vis?"#fde2e2":meta?"#f3e8ff":"var(--panel)"}" stroke="${vis?"var(--crit)":meta?"var(--violet)":"var(--line)"}" stroke-width="${vis||meta?2:1.2}"/>
  <text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="${vis?"#7f1d1d":"var(--ink)"}" font-weight="${graph.roots.includes(n.id)?700:500}">${esc(n.id)}</text></g>`;});
 svg.innerHTML=s;$("#g-note").textContent=`${graph.nodes.length} metrics · ${graph.edges.length} edges`;}

const STATE_COL={alerted:"var(--crit)",investigating:"var(--warn)",monitoring:"var(--accent)",resolved:"var(--good)",reopened:"var(--crit)",detected:"var(--warn)"};
async function loadIncs(){const incs=await (await fetch("/api/incidents")).json();$("#k-inc").textContent=incs.length;

 document.querySelectorAll(".inc-card").forEach(c=>c.onclick=()=>{sel=c.dataset.id;showInc(incs.find(x=>x.id===sel));loadIncs();});

function md(s){return esc(s).replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^### (.*)$/gm,"<h3>$1</h3>")
 .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^(\s*)- (.*)$/gm,(m,sp,t)=>`<li style="margin-left:${sp.length*8}px">${t}</li>`).replace(/\n\n/g,"<br>");}
async function showInc(i,quiet){$("#report").innerHTML=i.report_md?md(i.report_md):"<p class='muted'>investigating…</p>";

 chart(rows,`${i.first_cause} [${i.segment||"total"}]`);}
function chart(rows,title){if(!rows.length){$("#chart").innerHTML=`<p class="muted">${esc(title)}: series not monitored at this grain yet</p>`;return;}
 const W=$("#chart").clientWidth-24||340,H=120,P=28,ys=rows.flatMap(r=>[r.actual,r.low,r.high]).filter(Number.isFinite),
 lo=Math.min(...ys),hi=Math.max(...ys),x=i=>P+i*(W-P-6)/Math.max(1,rows.length-1),y=v=>H-18-(v-lo)/(hi-lo||1)*(H-30);
 const band=rows.map((r,i)=>`${x(i)},${y(r.high)}`).join(" ")+" "+rows.map((r,i)=>`${x(rows.length-1-i)},${y(rows[rows.length-1-i].low)}`).join(" ");

 $("#chart").innerHTML=`<div class="muted" style="font-size:11.5px">${esc(title)} · actual vs expected band (4σ)</div><svg width="${W}" height="${H}">
 <polygon points="${band}" fill="var(--accent)" opacity=".13"/><path d="${line("expected")}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
 <path d="${line("actual")}" fill="none" stroke="var(--ink)" stroke-width="2"/>
 ${rows.map((r,i)=>Math.abs(r.z)>=4.5?`<circle cx="${x(i)}" cy="${y(r.actual)}" r="4" fill="var(--crit)"><title>${r.ts} z=${(+r.z).toFixed(1)}</title></circle>`:"").join("")}
 <text x="${P}" y="${H-3}" font-size="10" fill="var(--muted)">${rows[0].ts.slice(5,16)}</text><text x="${W-6}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--muted)">${rows[rows.length-1].ts.slice(5,16)}</text></svg>`;}

 if(e.type==="THOUGHT"&&p.stage==="conclude")focus=null;
