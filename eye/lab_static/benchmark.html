<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eye of the System · Benchmark</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/static/lab.css">
  <script defer src="/static/benchmark.js"></script>
</head>
<body>
  <header class="app-bar">
    <div class="shell app-bar-row">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Eye of the System</div>
      <h1 class="app-bar-title">Benchmark</h1>
      <div class="app-bar-tools">
        <nav aria-label="Local views"><a href="/">Test lab</a></nav>
        <button class="theme-toggle" type="button" hidden>Use dark theme</button>
      </div>
    </div>
  </header>
  <main class="shell">
    <section class="panel" aria-labelledby="scores">
      <h2 id="scores">Scoreboard</h2>
      <form id="benchmark-launch">
        <label for="benchmark-description">Run description (optional)</label>
        <div class="inline">
          <input id="benchmark-description" type="text" maxlength="240" placeholder="What changed or what are you testing?">
          <button id="benchmark-start" type="submit" disabled>Run benchmark</button>
        </div>
      </form>
      <p id="benchmark-status" role="status">Checking the checkout.</p>
      <p id="benchmark-error" role="alert" hidden></p>
      <div class="workflow-table">
        <table id="benchmark-scoreboard">
          <thead><tr>
            <th scope="col" aria-sort="descending"><button type="button" data-sort="started_at" data-descending>Run</button></th>
            <th scope="col"><button type="button" data-sort="sha">Commit</button></th>
            <th scope="col"><button type="button" data-sort="suite">Suite and seed</button></th>
            <th scope="col"><button type="button" data-sort="model">Eye reasoning</button></th>
            <th scope="col"><button type="button" data-sort="completed" data-descending>Cases</button></th>
            <th scope="col"><button type="button" data-sort="detected" data-descending>Fault cases alerted</button></th>
            <th scope="col"><button type="button" data-sort="false_incidents">False incidents</button></th>
            <th scope="col"><button type="button" data-sort="incidents">Incidents</button></th>
            <th scope="col"><button type="button" data-sort="reviewed" data-descending>Reviews</button></th>
            <th scope="col"><button type="button" data-sort="median_detection_minutes">Median detection</button></th>
            <th scope="col"><button type="button" data-sort="median_recovery_minutes">Median recovery</button></th>
          </tr></thead>
          <tbody id="benchmark-runs"></tbody>
        </table>
      </div>
    </section>
    <details class="panel benchmark-results" id="benchmark-results" hidden>
      <summary><h2>Case results</h2></summary>
      <p id="benchmark-run-meta"></p>
      <details id="benchmark-methodology" class="benchmark-case">
        <summary>Run description and methodology</summary>
        <div id="benchmark-methodology-fields"></div>
      </details>
      <div id="benchmark-plots"></div>
      <div id="benchmark-cases"></div>
    </details>
  </main>
</body>
</html>
